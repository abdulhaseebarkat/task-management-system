services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-itms}
      POSTGRES_USER: ${DB_USERNAME:-itms}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-itms}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - itms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-itms}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-itms}
      DB_USERNAME: ${DB_USERNAME:-itms}
      DB_PASSWORD: ${DB_PASSWORD:-itms}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-before-any-real-deployment-32bytes+}
    ports:
      - "${BACKEND_HOST_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
    ports:
      - "${FRONTEND_HOST_PORT:-5174}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  itms_postgres_data:
