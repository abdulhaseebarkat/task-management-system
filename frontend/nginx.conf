server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing (react-router) - any path that isn't a real static file
    # falls back to index.html so deep links / refreshes don't 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reasonable caching for hashed build assets; index.html itself is never cached
    # since it's the entry point that references the current hashed bundle.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
