services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-itms}
      POSTGRES_USER: ${DB_USERNAME:-itms}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set a real DB_PASSWORD in .env}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - itms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-itms}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-itms}
      DB_USERNAME: ${DB_USERNAME:-itms}
      DB_PASSWORD: ${DB_PASSWORD:?Set a real DB_PASSWORD in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in .env, e.g. http://YOUR_VM_IP:5174}
      JWT_SECRET: ${JWT_SECRET:?Set a real, random JWT_SECRET in .env}
      # Caps JVM heap so this backend can't crowd out everything else running on the
      # same small VM - the JVM reads this automatically, no Dockerfile change needed.
      JAVA_TOOL_OPTIONS: "-Xmx384m -Xms128m"
    ports:
      - "${BACKEND_HOST_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:?Set VITE_API_URL in .env, e.g. http://YOUR_VM_IP:8081/api}
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-5174}:80"
    depends_on:
      - backend

volumes:
  itms_postgres_data:
